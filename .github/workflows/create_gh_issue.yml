# ## Summary
#
# Create GitHub Issue from the given arguments.

# ## Usage
#
# name: Create GitHub Issue
#
# on:
#   schedule:
#     # 毎週水曜 13:00 JST に実行
#     - cron: "0 4 * * wed"
#
# jobs:
#   create_issue:
#     uses: route06/actions/.github/workflows/create_gh_issue.yml@v2
#     permissions:
#       contents: read
#       issues: write
#     with:
#       title: Sample Issue
#       description_template_path: _templates/sample_issue.md
#       assignees: alice,bob
#       labels: bug,wontfix

name: Create GitHub Issue

on:
  workflow_call:
    inputs:
      title:
        description: "作成する Issue のタイトル"
        required: true
        type: string
      description_template_path:
        description: "Issue の説明に利用するテンプレートファイルのパス"
        required: true
        type: string
      assignees:
        description: "（任意）Issue の Assignees; 例: alice,bob"
        type: string
      labels:
        description: "（任意）Issue の Labels; 例: bug,wontfix"
        type: string

jobs:
  create_issue:
    runs-on: ubuntu-latest
    # Use the updated OS store, not the runner's potentially older bundled CA set.
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
    timeout-minutes: 5
    steps:
      # Inline because checkout in a reusable workflow resolves the caller repository.
      - name: Update Ubuntu CA trust before authenticated requests
        shell: bash
        run: |
          . /etc/os-release
          case "$VERSION_ID" in
            24.04) minimum=20260816ubuntu0.24.04.1 ;;
            26.04) minimum=20260816ubuntu0.26.04.1 ;;
            *) echo 'Unsupported Ubuntu release for CA remediation'; exit 1 ;;
          esac
          installed=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$installed" ge "$minimum"; then
            sudo apt-get update -o APT::Update::Error-Mode=any
            sudo apt-get install --only-upgrade --no-install-recommends -y ca-certificates
          fi
          installed=$(dpkg-query -W -f='${Version}' ca-certificates)
          printf 'CA package: %s; required minimum: %s\n' "$installed" "$minimum"
          dpkg --compare-versions "$installed" ge "$minimum"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a issue
        run: |
          gh issue create \
            --title '${{ inputs.title }}' \
            --body-file '${{ inputs.description_template_path }}' \
            --assignee '${{ inputs.assignees }}' \
            --label '${{ inputs.labels }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
