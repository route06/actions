# ## Summary
#
# "SLACK_XXX_WEBHOOK_URL" に紐づく channel に、CI 失敗時用の Slack 通知をする。

# ## Usage
#
# name: Notify to Slack on CI failure
#
# jobs:
#   notify:
#     uses: route06/actions/.github/workflows/notify_slack_on_ci_failed.yml@v2
#     with:
#       title: CI failed / ci.yml
#     secrets:
#       SLACK_WEBHOOK_URL: ${{ secrets.SLACK_XXX_WEBHOOK_URL }} # Set this secret

name: Notify to Slack on CI failure

on:
  workflow_call:
    inputs:
      title:
        description: Slackメッセージのタイトル
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify-slack-on-ci-failed:
    runs-on: ubuntu-latest
    # Use the updated OS store, not the runner's potentially older bundled CA set.
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
    timeout-minutes: 5

    steps:
      # Inline because checkout in a reusable workflow resolves the caller repository.
      - name: Update Ubuntu CA trust before authenticated requests
        shell: bash
        run: |
          . /etc/os-release
          case "$VERSION_ID" in
            24.04) minimum=20260816ubuntu0.24.04.1 ;;
            26.04) minimum=20260816ubuntu0.26.04.1 ;;
            *) echo 'Unsupported Ubuntu release for CA remediation'; exit 1 ;;
          esac
          installed=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$installed" ge "$minimum"; then
            sudo apt-get update -o APT::Update::Error-Mode=any
            sudo apt-get install --only-upgrade --no-install-recommends -y ca-certificates
          fi
          installed=$(dpkg-query -W -f='${Version}' ca-certificates)
          printf 'CA package: %s; required minimum: %s\n' "$installed" "$minimum"
          dpkg --compare-versions "$installed" ge "$minimum"

      - name: Set COMMIT_MESSAGE
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" | tr '\n' ' ' >> "$GITHUB_ENV"
      - name: Notify to slack
        uses: tokorom/action-slack-incoming-webhook@d57bf1eb618f3dae9509afefa70d5774ad3d42bf # v1.3.0
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: ${{ inputs.title }}
          attachments: |
            [
              {
                "color": "bad",
                "author_name": "${{ github.actor }}",
                "author_icon": "${{ github.event.sender.avatar_url }}",
                "fields": [
                  {
                    "title": "Commit Message",
                    "value": "${{ env.COMMIT_MESSAGE }}"
                  },
                  {
                    "title": "GitHub Actions URL",
                    "value": "${{ github.event.repository.url }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "title": "Compare URL",
                    "value": "${{ github.event.compare }}"
                  }
                ]
              }
            ]
