# ## Summary
#
# "SLACK_XXX_WEBHOOK_URL" に紐づく channel に、CI 失敗時用の Slack 通知をする。

# ## Usage
#
# name: Notify to Slack on CI failure
#
# jobs:
#   notify:
#     uses: route06/actions/.github/workflows/notify_slack_on_ci_failed.yml@v2
#     with:
#       title: CI failed / ci.yml
#     secrets:
#       SLACK_WEBHOOK_URL: ${{ secrets.SLACK_XXX_WEBHOOK_URL }} # Set this secret

name: Notify to Slack on CI failure

on:
  workflow_call:
    inputs:
      title:
        description: Slackメッセージのタイトル
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify-slack-on-ci-failed:
    runs-on: ubuntu-latest
    # Use the updated OS store, not the runner's potentially older bundled CA set.
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
    timeout-minutes: 5

    steps:
      - name: Prepare Ubuntu CA trust
        uses: route06/actions/prepare-ubuntu-ca@aa6b218e4bc5445f54d3649a04297af5e1ce7458 # temporary CA mitigation

      - name: Notify Slack
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TITLE: ${{ inputs.title }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.actor }}
          AUTHOR_ICON: ${{ github.event.sender.avatar_url }}
          RUN_URL: ${{ github.event.repository.url }}/actions/runs/${{ github.run_id }}
          COMPARE_URL: ${{ github.event.compare }}
        shell: bash
        run: |
          commit_message=$(printf '%s' "$COMMIT_MESSAGE" | tr '\n' ' ')
          payload=$(jq -n \
            --arg text "$TITLE" \
            --arg author_name "$AUTHOR_NAME" \
            --arg author_icon "$AUTHOR_ICON" \
            --arg commit_message "$commit_message" \
            --arg run_url "$RUN_URL" \
            --arg compare_url "$COMPARE_URL" \
            '{
              text: $text,
              attachments: [{
                color: "bad",
                author_name: $author_name,
                author_icon: $author_icon,
                fields: [
                  {title: "Commit Message", value: $commit_message},
                  {title: "GitHub Actions URL", value: $run_url},
                  {title: "Compare URL", value: $compare_url}
                ]
              }]
            }')

          curl --fail --silent --show-error --output /dev/null \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" --url "$INCOMING_WEBHOOK_URL"
