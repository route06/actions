name: My CA Update Test

on:
  pull_request:
    paths:
      - .github/workflows/my_ca_update_test.yml
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Record baseline
        shell: bash
        run: |
          dpkg-query -W ca-certificates
          for host in dv-g3b-emudhra.we-have-a-problem.com dv-g3b-aaa-emudhra.we-have-a-problem.com; do
            status=0
            curl --silent --show-error --output /dev/null --connect-timeout 10 --max-time 20 "https://$host/" || status=$?
            printf '%s baseline curl exit: %s\n' "$host" "$status"
          done

      - name: Update the Ubuntu CA package
        shell: bash
        run: |
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install --only-upgrade --no-install-recommends -y ca-certificates
          . /etc/os-release
          case "$VERSION_ID" in
            24.04) minimum=20260816ubuntu0.24.04.1 ;;
            26.04) minimum=20260816ubuntu0.26.04.1 ;;
            *) echo 'Unsupported Ubuntu release'; exit 1 ;;
          esac
          installed=$(dpkg-query -W -f='${Version}' ca-certificates)
          printf 'Installed CA package: %s; required: %s\n' "$installed" "$minimum"
          dpkg --compare-versions "$installed" ge "$minimum"

      - name: Verify curl rejects both affected chains and accepts GitHub
        shell: bash
        run: |
          for host in dv-g3b-emudhra.we-have-a-problem.com dv-g3b-aaa-emudhra.we-have-a-problem.com; do
            status=0
            curl --silent --show-error --output /dev/null --connect-timeout 10 --max-time 20 "https://$host/" || status=$?
            printf '%s updated curl exit: %s\n' "$host" "$status"
            test "$status" -eq 60
          done
          curl --fail --silent --show-error --output /dev/null --connect-timeout 10 --max-time 20 https://api.github.com/

      - name: Verify runner Node using the updated OpenSSL trust store
        env:
          NODE_OPTIONS: --use-openssl-ca
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_DIR: /etc/ssl/certs
        shell: bash
        run: |
          worker_node=$(python3 - <<'PY'
          from pathlib import Path
          candidates = set()
          for process in Path('/proc').iterdir():
              if not process.name.isdigit():
                  continue
              try:
                  executable = (process / 'exe').resolve(strict=True)
              except (OSError, RuntimeError):
                  continue
              if executable.name == 'Runner.Worker':
                  candidates.add(str(executable.parent.parent / 'externals/node24/bin/node'))
          if len(candidates) != 1:
              raise SystemExit('Expected exactly one active runner Node')
          print(candidates.pop())
          PY
          )
          "$worker_node" - <<'JS'
          const https = require('node:https');
          console.log('Runner Node:', process.version);
          function connect(host) {
            return new Promise((resolve, reject) => {
              const req = https.get({host, path: '/', headers: {'User-Agent': 'tls-ca-validation'}}, res => {
                res.resume();
                resolve(res.statusCode);
              });
              req.setTimeout(20000, () => req.destroy(new Error('Request timed out')));
              req.on('error', reject);
            });
          }
          (async () => {
            for (const host of ['dv-g3b-emudhra.we-have-a-problem.com', 'dv-g3b-aaa-emudhra.we-have-a-problem.com']) {
              let rejected = false;
              try {
                await connect(host);
              } catch (error) {
                console.log(host, error.code);
                if (!['UNABLE_TO_GET_ISSUER_CERT_LOCALLY', 'UNABLE_TO_VERIFY_LEAF_SIGNATURE', 'CERT_UNTRUSTED'].includes(error.code)) throw error;
                rejected = true;
              }
              if (!rejected) throw new Error('Affected chain was accepted: ' + host);
            }
            const status = await connect('api.github.com');
            if (status !== 200) throw new Error('Unexpected GitHub response: ' + status);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
