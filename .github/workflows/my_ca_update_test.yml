name: My CA Update Test

on:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - 'prepare-ubuntu-ca/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Record baseline
        shell: bash
        run: |
          dpkg-query -W ca-certificates
          for host in dv-g3b-emudhra.we-have-a-problem.com dv-g3b-aaa-emudhra.we-have-a-problem.com; do
            status=0
            curl --silent --show-error --output /dev/null --connect-timeout 10 --max-time 20 "https://$host/" || status=$?
            printf '%s baseline curl exit: %s\n' "$host" "$status"
          done

      - name: Prepare Ubuntu CA trust
        uses: route06/actions/prepare-ubuntu-ca@aa6b218e4bc5445f54d3649a04297af5e1ce7458 # temporary CA mitigation

      - name: Verify curl rejects both affected chains and accepts GitHub
        shell: bash
        run: |
          for host in dv-g3b-emudhra.we-have-a-problem.com dv-g3b-aaa-emudhra.we-have-a-problem.com; do
            status=0
            curl --silent --show-error --output /dev/null --connect-timeout 10 --max-time 20 "https://$host/" || status=$?
            printf '%s updated curl exit: %s\n' "$host" "$status"
            test "$status" -eq 60
          done
          curl --fail --silent --show-error --output /dev/null --connect-timeout 10 --max-time 20 https://api.github.com/

      - name: Verify JavaScript action uses the updated trust store
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          NODE_OPTIONS: --use-openssl-ca
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_DIR: /etc/ssl/certs
        with:
          script: |
            const https = require('node:https');
            console.log('Action Node:', process.version);
            function connect(host) {
              return new Promise((resolve, reject) => {
                const req = https.get({host, path: '/', headers: {'User-Agent': 'tls-ca-validation'}}, res => {
                  res.resume();
                  resolve(res.statusCode);
                });
                req.setTimeout(20000, () => req.destroy(new Error('Request timed out')));
                req.on('error', reject);
              });
            }
            for (const host of ['dv-g3b-emudhra.we-have-a-problem.com', 'dv-g3b-aaa-emudhra.we-have-a-problem.com']) {
              let rejected = false;
              try {
                await connect(host);
              } catch (error) {
                console.log(host, error.code);
                if (!['UNABLE_TO_GET_ISSUER_CERT_LOCALLY', 'UNABLE_TO_VERIFY_LEAF_SIGNATURE', 'CERT_UNTRUSTED'].includes(error.code)) throw error;
                rejected = true;
              }
              if (!rejected) throw new Error('Affected chain was accepted: ' + host);
            }
            const status = await connect('api.github.com');
            if (status !== 200) throw new Error('Unexpected GitHub response: ' + status);
            await github.rest.repos.get({owner: context.repo.owner, repo: context.repo.repo});

      - name: Verify checkout with the updated trust store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          NODE_OPTIONS: --use-openssl-ca
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_DIR: /etc/ssl/certs
        with:
          persist-credentials: false

      - name: Verify GitHub CLI with the updated trust store
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq .full_name
