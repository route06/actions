# ## Summary
#
# The core workflow of CodeQL which called by .github/workflows/codeql.yml

# ## Usage
#
# None.

name: Run CodeQL Core

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string

jobs:
  analyze:
    name: Perform CodeQL for ${{ inputs.language }}
    runs-on: ${{ (inputs.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TODO: CodeQL が動作しないため暫定対応
      # 理想は inputs に java-version を持たせ引数にする
      - name: Set up JDK 17
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ inputs.language }}

      # コンパイルされた言語を解析するために必要
      # コンパイルされていない言語の場合は直ちに正常終了する
      - name: Auto build
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
