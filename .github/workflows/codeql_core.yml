# ## Summary
#
# The core workflow of CodeQL which called by .github/workflows/codeql.yml

# ## Usage
#
# None.

name: Run CodeQL Core

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string

jobs:
  analyze:
    name: Perform CodeQL for ${{ inputs.language }}
    runs-on: ${{ (inputs.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TODO: CodeQL が動作しないため暫定対応
      # 理想は inputs に java-version を持たせ引数にする
      - name: Set up JDK 17
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ inputs.language }}

      # コンパイルされた言語を解析するために必要
      # コンパイルされていない言語の場合は直ちに正常終了する
      - name: Auto build
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
